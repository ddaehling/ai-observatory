  <circle cx="296" cy="296" r="8" fill="none" stroke-width="2.4"/>
  <path d="M200 92l4.6 15 15 4.6-15 4.6-4.6 15-4.6-15-15-4.6 15-4.6z" fill="#000" stroke="none"/>
  <!-- apparent positions of the near star against the distant field -->
  <path d="M200 118 152 46M200 118 248 46" stroke-width=".8" stroke-dasharray="1 4" opacity=".7"/>
  <circle cx="152" cy="46" r="3.2" fill="#000" stroke="none" opacity=".8"/>
  <circle cx="248" cy="46" r="3.2" fill="none" stroke-width="1.4" opacity=".8"/>
  <g fill="#000" stroke="none" opacity=".55">
    <circle cx="86" cy="150" r="1.4"/><circle cx="318" cy="132" r="1.8"/><circle cx="270" cy="232" r="1.2"/>
    <circle cx="132" cy="214" r="1.6"/><circle cx="338" cy="250" r="1.2"/><circle cx="58" cy="246" r="1.2"/>
