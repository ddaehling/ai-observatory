  <circle cx="200" cy="200" r="194" stroke-width="1"/>
  <circle cx="200" cy="200" r="182" stroke-width="7" stroke-dasharray="0.8 15.08" opacity=".7"/>
  <circle cx="200" cy="200" r="182" stroke-width="13" stroke-dasharray="1.2 78.21" opacity=".9"/>
  <circle cx="200" cy="200" r="140" stroke-width="1" stroke-dasharray="2 5" opacity=".7"/>
  <circle cx="200" cy="200" r="92" stroke-width="1" opacity=".55"/>
  <circle cx="200" cy="200" r="40" stroke-width="1" stroke-dasharray="1 4" opacity=".55"/>
  <path d="M200 0v400M0 200h400" stroke-width="1" stroke-dasharray="1 6" opacity=".6"/>
  <path d="M62.8 62.8l274.4 274.4M337.2 62.8L62.8 337.2" stroke-width=".8" stroke-dasharray="1 9" opacity=".4"/>
  <!-- baseline (A, B) and sight lines to the near star -->
  <path d="M104 296h192" stroke-width="1" opacity=".5"/>
  <path d="M104 296 200 118 296 296" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round"/>
