<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Parallax">
  <title>Parallax</title>
  <!-- The plate in miniature: a trail of light ending at tonight's meridian, and inside it a
       doubled trail where two runs disagreed — run A cool, run B warm. -->
  <rect width="32" height="32" rx="7" fill="#05070d"/>
  <path d="M16 5.20 A10.8 10.8 0 1 1 5.99 11.95" fill="none" stroke="#eef2fa" stroke-width="1.7" stroke-linecap="round" opacity=".92"/>
  <path d="M16 9.80 A6.2 6.2 0 1 1 12.71 21.26" fill="none" stroke="#9cc6ff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 11.80 A4.2 4.2 0 0 1 16.87 20.11" fill="none" stroke="#ffad78" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="5.2" r="1.7" fill="#ffffff"/>
  <circle cx="16" cy="16" r=".9" fill="#eef2fa"/>
</svg>
